<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TCE · Simulación del API Apps Script</title>
  <style>
    :root {
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #17211b;
      background: #f1f4f3;
    }

    body {
      max-width: 920px;
      margin: 0 auto;
      padding: 38px 20px 60px;
    }

    h1 {
      margin: 0 0 6px;
      color: #234f3a;
      font-size: 24px;
    }

    p {
      margin: 0;
      color: #6b7c72;
      font-size: 14px;
    }

    .summary {
      margin: 18px 0;
      padding: 14px 18px;
      border-radius: 12px;
      background: #edf2ef;
      font-size: 14px;
      font-weight: 700;
    }

    .summary--ok { background: #e8f7ee; color: #166534; }
    .summary--fail { background: #fdecec; color: #b91c1c; }

    .tests {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .test {
      display: grid;
      grid-template-columns: 64px 1fr;
      gap: 10px;
      padding: 11px 14px;
      border: 1px solid #dce5df;
      border-radius: 10px;
      background: #fff;
      font-size: 13px;
    }

    .test__status { font-size: 11px; font-weight: 800; letter-spacing: 0.06em; }
    .test--pass .test__status { color: #16a34a; }
    .test--fail .test__status { color: #dc2626; }

    .test__error {
      grid-column: 2;
      margin: 6px 0 0;
      padding: 8px;
      overflow: auto;
      border-radius: 6px;
      background: #fdecec;
      color: #7f1d1d;
      font-size: 12px;
      white-space: pre-wrap;
    }

    .log {
      margin-top: 24px;
      padding: 14px;
      border: 1px solid #dce5df;
      border-radius: 10px;
      background: #0c2118;
      color: #b9d3c5;
      font-family: "Consolas", monospace;
      font-size: 11px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>Simulación del API · TCE v2</h1>
  <p>
    Ejecuta los mismos archivos de <code>appsscript/</code> sobre una hoja de cálculo simulada.
    No usa Google ni modifica datos reales.
  </p>

  <div id="summary" class="summary">Ejecutando…</div>
  <ul id="results" class="tests"></ul>
  <pre id="log" class="log" hidden></pre>

  <script>
    // ======================================
    // ENTORNO SIMULADO DE APPS SCRIPT
    // ======================================

    const store = {
      properties: new Map(),
      spreadsheets: new Map(),
      logs: []
    };

    let spreadsheetSequence = 0;

    class FakeSheet {
      constructor(name) {
        this.name = name;
        this.data = [];
        this.maxRows = 1000;
        this.maxColumns = 30;
      }

      ensureSize(rows, columns) {
        while (this.data.length < rows) this.data.push([]);
        this.data.forEach(row => {
          while (row.length < columns) row.push("");
        });
      }

      getRange(row, column, numRows = 1, numColumns = 1) {
        const sheet = this;

        return {
          getValues() {
            const values = [];
            for (let r = 0; r < numRows; r += 1) {
              const line = [];
              for (let c = 0; c < numColumns; c += 1) {
                line.push(sheet.data[row - 1 + r]?.[column - 1 + c] ?? "");
              }
              values.push(line);
            }
            return values;
          },
          setValues(values) {
            sheet.ensureSize(row - 1 + numRows, column - 1 + numColumns);
            values.forEach((line, r) => {
              line.forEach((value, c) => {
                sheet.data[row - 1 + r][column - 1 + c] = value;
              });
            });
            return this;
          },
          setValue(value) {
            return this.setValues([[value]]);
          },
          setBackground() { return this; },
          setFontColor() { return this; },
          setFontWeight() { return this; },
          setVerticalAlignment() { return this; },
          setNumberFormat() { return this; }
        };
      }

      getDataRange() {
        return this.getRange(
          1,
          1,
          Math.max(this.getLastRow(), 1),
          Math.max(this.getLastColumn(), 1)
        );
      }

      getLastRow() {
        let last = 0;
        this.data.forEach((row, index) => {
          if (row.some(value => String(value ?? "").trim() !== "")) last = index + 1;
        });
        return last;
      }

      getLastColumn() {
        let last = 0;
        this.data.forEach(row => {
          row.forEach((value, index) => {
            if (String(value ?? "").trim() !== "") last = Math.max(last, index + 1);
          });
        });
        return last;
      }

      getMaxRows() { return this.maxRows; }
      getMaxColumns() { return this.maxColumns; }
      getName() { return this.name; }
      setFrozenRows() {}
      setRowHeight() {}
      setColumnWidth() {}
    }

    class FakeSpreadsheet {
      constructor(name, id) {
        this.name = name;
        this.id = id;
        this.sheets = [];
      }

      getId() { return this.id; }
      getName() { return this.name; }
      getUrl() { return `https://docs.google.com/spreadsheets/d/${this.id}/edit`; }
      getSheets() { return this.sheets; }

      getSheetByName(name) {
        return this.sheets.find(sheet => sheet.name === name) || null;
      }

      insertSheet(name) {
        const sheet = new FakeSheet(name);
        this.sheets.push(sheet);
        return sheet;
      }

      deleteSheet(sheet) {
        this.sheets = this.sheets.filter(item => item !== sheet);
      }
    }

    const SpreadsheetApp = {
      create(name) {
        spreadsheetSequence += 1;
        const spreadsheet = new FakeSpreadsheet(name, `fake-id-${spreadsheetSequence}`);
        spreadsheet.insertSheet("Hoja 1");
        store.spreadsheets.set(spreadsheet.id, spreadsheet);
        return spreadsheet;
      },
      openById(id) {
        const spreadsheet = store.spreadsheets.get(id);
        if (!spreadsheet) throw new Error("No existe la hoja " + id);
        return spreadsheet;
      }
    };

    const PropertiesService = {
      getScriptProperties() {
        return {
          getProperty(key) { return store.properties.get(key) || null; },
          setProperty(key, value) { store.properties.set(key, String(value)); }
        };
      }
    };

    const Session = {
      getScriptTimeZone() { return "America/Santiago"; }
    };

    const Utilities = {
      DigestAlgorithm: { SHA_256: "SHA_256" },
      Charset: { UTF_8: "UTF_8" },
      getUuid() { return crypto.randomUUID(); },
      formatDate(date, timezone) {
        const parts = new Intl.DateTimeFormat("en-CA", {
          timeZone: timezone,
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }).formatToParts(date);
        const get = type => parts.find(part => part.type === type)?.value || "";
        return `${get("year")}-${get("month")}-${get("day")}`;
      },
      computeDigest(_algorithm, text) {
        let seed = 2166136261;
        const source = String(text);
        for (let index = 0; index < source.length; index += 1) {
          seed ^= source.charCodeAt(index);
          seed = Math.imul(seed, 16777619);
        }
        const bytes = [];
        for (let index = 0; index < 32; index += 1) {
          seed ^= Math.imul(index + 1, 2654435761);
          seed = Math.imul(seed, 16777619);
          bytes.push((seed >>> 24) & 255);
        }
        return bytes;
      }
    };

    const LockService = {
      getScriptLock() {
        return { tryLock() { return true; }, releaseLock() {} };
      }
    };

    const ContentService = {
      MimeType: { JSON: "application/json" },
      createTextOutput(text) {
        return {
          text,
          setMimeType() { return this; },
          getContent() { return this.text; }
        };
      }
    };

    const Logger = {
      log(message) { store.logs.push(String(message)); }
    };

    // ======================================
    // CARGA DE LOS ARCHIVOS .GS
    // ======================================

    const FILES = [
      "Config", "Utils", "Scoring", "SheetRepository", "Setup",
      "SurveyService", "ResponseService", "MeasurementService", "Migration", "Api"
    ];

    const tests = [];
    function test(name, run) { tests.push({ name, run }); }

    function assert(condition, message) {
      if (!condition) throw new Error(message || "Condición falsa.");
    }

    function assertEqual(actual, expected, message = "") {
      const left = typeof actual === "object" ? JSON.stringify(actual) : String(actual);
      const right = typeof expected === "object" ? JSON.stringify(expected) : String(expected);
      if (left !== right) throw new Error(`${message} Esperado ${right}, recibido ${left}.`);
    }

    function post(body) {
      return { parameter: {}, postData: { contents: JSON.stringify(body) } };
    }

    function get(parameters) {
      return { parameter: parameters };
    }

    function call(event, method) {
      const output = routeRequest_(event, method);
      return JSON.parse(output.getContent());
    }

    function responseValues(offset) {
      return {
        bienestar: offset,
        inclusion: offset,
        buenTrato: offset,
        participacion: offset,
        seguridad: offset,
        pertenencia: offset,
        relaciones: offset
      };
    }

    let TOKEN = "";
    let SURVEY = "";
    let MEASUREMENT = "";

    async function run() {
      const results = document.getElementById("results");
      const summary = document.getElementById("summary");
      let passed = 0;
      let failed = 0;

      for (const item of tests) {
        try {
          await item.run();
          passed += 1;
          addResult(results, item.name);
        } catch (error) {
          failed += 1;
          addResult(results, item.name, error);
          console.error(item.name, error);
        }
      }

      summary.textContent = `${passed} correctas · ${failed} fallidas · ${tests.length} pruebas`;
      summary.className = failed === 0 ? "summary summary--ok" : "summary summary--fail";
      document.title = failed === 0 ? `TCE API simulación OK (${passed})` : `TCE API simulación · ${failed} fallidas`;

      const log = document.getElementById("log");
      log.hidden = false;
      log.textContent = store.logs.join("\n");
    }

    function addResult(list, name, error) {
      const item = document.createElement("li");
      item.className = error ? "test test--fail" : "test test--pass";

      const status = document.createElement("span");
      status.className = "test__status";
      status.textContent = error ? "FAIL" : "PASS";

      const label = document.createElement("span");
      label.textContent = name;

      item.append(status, label);

      if (error) {
        const detail = document.createElement("pre");
        detail.className = "test__error";
        detail.textContent = error.message || String(error);
        item.appendChild(detail);
      }

      list.appendChild(item);
    }

    // ======================================
    // CASOS
    // ======================================

    test("setup crea hojas, token y elimina la hoja por defecto", () => {
      const result = setup();
      TOKEN = result.token;

      assert(result.ok, "setup no devolvió ok.");
      assert(TOKEN.length > 20, "Token demasiado corto.");
      assertEqual(result.sheets.length, 3);

      const spreadsheet = SpreadsheetApp.openById(result.spreadsheetId);
      assertEqual(spreadsheet.getSheets().map(sheet => sheet.getName()).join(","), "MEDICIONES,ENCUESTAS,RESPUESTAS");
      assertEqual(result.created, true);
    });

    test("setup es idempotente y conserva el token", () => {
      const before = store.properties.get("TCE_SPREADSHEET_ID");
      const result = setup();
      assertEqual(result.spreadsheetId, before);
      assertEqual(result.token, TOKEN);
      assertEqual(result.created, false);
    });

    test("ping responde con la hoja configurada", () => {
      const payload = call(get({ accion: "ping" }), "GET");
      assertEqual(payload.ok, true);
      assertEqual(payload.hoja, "TCE_BD_v2");
      assertEqual(payload.estado, "OK");
    });

    test("crear encuesta sin token es rechazado", () => {
      const payload = call(post({ accion: "crearEncuesta", curso: "7° Básico A", responsable: "Ana", participantes: 30 }), "POST");
      assertEqual(payload.ok, false);
      assertEqual(payload.error.code, "NO_AUTORIZADO");
    });

    test("crear encuesta valida participantes fuera de rango", () => {
      const payload = call(post({ accion: "crearEncuesta", token: TOKEN, curso: "7° Básico A", responsable: "Ana", participantes: 500 }), "POST");
      assertEqual(payload.ok, false);
      assertEqual(payload.error.code, "PARTICIPANTES_INVALIDOS");
    });

    test("crear encuesta genera un código de 8 caracteres", () => {
      const payload = call(post({
        accion: "crearEncuesta",
        token: TOKEN,
        curso: "7° Básico A",
        responsable: "Ana Pérez",
        participantes: 30
      }), "POST");

      assertEqual(payload.ok, true);
      SURVEY = payload.encuesta.id;

      assertEqual(SURVEY.length, 8);
      assert(/^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]+$/.test(SURVEY), "Código con caracteres no permitidos.");
      assertEqual(payload.encuesta.estado, "ACTIVA");
      assertEqual(payload.encuesta.nivel, "7° Básico");
      assertEqual(payload.encuesta.respuestasRecibidas, 0);
    });

    test("obtenerEncuesta es público y devuelve el curso", () => {
      const payload = call(get({ accion: "obtenerEncuesta", codigo: SURVEY.toLowerCase() }), "GET");
      assertEqual(payload.ok, true);
      assertEqual(payload.encuesta.curso, "7° Básico A");
      assertEqual(payload.encuesta.responsable, "Ana Pérez");
    });

    test("obtenerEncuesta con código inexistente devuelve error claro", () => {
      const payload = call(get({ accion: "obtenerEncuesta", codigo: "NOEXISTE" }), "GET");
      assertEqual(payload.ok, false);
      assertEqual(payload.error.code, "ENCUESTA_NO_ENCONTRADA");
    });

    test("guardar respuesta anónima registra una respuesta", () => {
      const payload = call(post({
        accion: "guardarRespuesta",
        codigo: SURVEY,
        deviceId: "device-aaaaaaaa-1111",
        respuestas: responseValues(4)
      }), "POST");

      assertEqual(payload.ok, true);
      assertEqual(payload.duplicado, false);
      assertEqual(payload.recibidas, 1);
    });

    test("el mismo dispositivo no puede responder dos veces", () => {
      const payload = call(post({
        accion: "guardarRespuesta",
        codigo: SURVEY,
        deviceId: "device-aaaaaaaa-1111",
        respuestas: responseValues(2)
      }), "POST");

      assertEqual(payload.ok, true);
      assertEqual(payload.duplicado, true);
      assertEqual(payload.recibidas, 1);
    });

    test("un segundo dispositivo suma otra respuesta", () => {
      const payload = call(post({
        accion: "guardarRespuesta",
        codigo: SURVEY,
        deviceId: "device-bbbbbbbb-2222",
        respuestas: responseValues(5)
      }), "POST");

      assertEqual(payload.duplicado, false);
      assertEqual(payload.recibidas, 2);
    });

    test("la hoja RESPUESTAS guarda solo el hash del dispositivo", () => {
      const responses = readObjects_("RESPUESTAS");
      assertEqual(responses.length, 2);
      responses.forEach(row => {
        assertEqual(String(row.deviceHash).length, 64);
        assert(!String(row.deviceHash).includes("device-"), "Se guardó el identificador en claro.");
      });
    });

    test("cerrar encuesta impide nuevas respuestas", () => {
      const closed = call(post({ accion: "cerrarEncuesta", token: TOKEN, codigo: SURVEY }), "POST");
      assertEqual(closed.encuesta.estado, "CERRADA");

      const blocked = call(post({
        accion: "guardarRespuesta",
        codigo: SURVEY,
        deviceId: "device-cccccccc-3333",
        respuestas: responseValues(4)
      }), "POST");

      assertEqual(blocked.ok, false);
      assertEqual(blocked.error.code, "ENCUESTA_CERRADA");
    });

    test("procesar encuesta crea la medición agregada", () => {
      const payload = call(post({ accion: "procesarEncuesta", token: TOKEN, codigo: SURVEY }), "POST");
      assertEqual(payload.ok, true);
      assertEqual(payload.encuesta.estado, "PROCESADA");
      assertEqual(payload.medicion.participantes, 2);
      assertEqual(payload.medicion.promedio, 4.5);
      assertEqual(payload.medicion.categoria, "FORTALECIDA");
      assertEqual(payload.medicion.origen, "ENCUESTA");
      MEASUREMENT = payload.medicion.id;
    });

    test("procesar dos veces no duplica la medición", () => {
      const payload = call(post({ accion: "procesarEncuesta", token: TOKEN, codigo: SURVEY }), "POST");
      assertEqual(payload.yaExistia, true);
      assertEqual(payload.medicion.id, MEASUREMENT);
      assertEqual(readObjects_("MEDICIONES").length, 1);
    });

    test("listarMediciones devuelve el resultado agregado", () => {
      const payload = call(get({ accion: "listarMediciones" }), "GET");
      assertEqual(payload.ok, true);
      assertEqual(payload.mediciones.length, 1);
      assertEqual(payload.mediciones[0].curso, "7° Básico A");
      assertEqual(payload.mediciones[0].dimensiones.bienestar, 4.5);
    });

    test("guardarMedicionManual respeta la fecha enviada", () => {
      const payload = call(post({
        accion: "guardarMedicionManual",
        token: TOKEN,
        curso: "8° Básico B",
        responsable: "Carlos Rivas",
        fecha: "2026-05-01",
        respuestas: [responseValues(3), responseValues(3)]
      }), "POST");

      assertEqual(payload.ok, true);
      assertEqual(payload.medicion.fecha, "2026-05-01");
      assertEqual(payload.medicion.promedio, 3);
      assertEqual(payload.medicion.origen, "MANUAL");
      assertEqual(readObjects_("MEDICIONES").length, 2);
    });

    test("guardarMedicionManual rechaza filas incompletas", () => {
      const payload = call(post({
        accion: "guardarMedicionManual",
        token: TOKEN,
        curso: "8° Básico B",
        responsable: "Carlos Rivas",
        fecha: "2026-05-02",
        respuestas: [{ bienestar: 3 }]
      }), "POST");

      assertEqual(payload.ok, false);
      assertEqual(payload.error.code, "RESPUESTA_INVALIDA");
    });

    test("listarEncuestas requiere token", () => {
      const payload = call(post({ accion: "listarEncuestas", token: "invalido" }), "POST");
      assertEqual(payload.ok, false);
      assertEqual(payload.error.code, "NO_AUTORIZADO");
    });

    test("listarEncuestas devuelve el avance de la encuesta", () => {
      const payload = call(post({ accion: "listarEncuestas", token: TOKEN }), "POST");
      assertEqual(payload.ok, true);
      assertEqual(payload.encuestas.length, 1);
      assertEqual(payload.encuestas[0].id, SURVEY);
      assertEqual(payload.encuestas[0].respuestasRecibidas, 2);
      assertEqual(payload.encuestas[0].medicionID, MEASUREMENT);
    });

    test("una acción desconocida devuelve ACCION_NO_RECONOCIDA", () => {
      const payload = call(get({ accion: "noExiste" }), "GET");
      assertEqual(payload.ok, false);
      assertEqual(payload.error.code, "ACCION_NO_RECONOCIDA");
    });

    // ======================================
    // ARRANQUE
    // ======================================

    (async () => {
      try {
        const source = (await Promise.all(
          FILES.map(name => fetch(`../appsscript/${name}.gs`).then(response => response.text()))
        )).join("\n\n");

        (0, eval)(source);
        await run();
      } catch (error) {
        document.getElementById("summary").textContent = `Error al cargar la simulación: ${error.message}`;
        document.getElementById("summary").className = "summary summary--fail";
        console.error(error);
      }
    })();
  </script>
</body>
</html>
